# GovHub Insights — daily vendor-profile publisher.
#
# Publishes up to 8 new vendor profile pages per day from the roster's pending
# backlog (src/data/insights/vendor-roster.json), so the ~50 vendors the weekly
# run appends to the roster spread across the week instead of landing in one
# burst. Runs Tue-Sun; Monday's batch is published by the weekly-insights run,
# which also expands the roster and refreshes existing pages.
#
# A day with an empty backlog is a clean no-op (nothing to commit). A failed
# run commits nothing, and GitHub emails the failure by default — same
# fail-safe model as weekly-insights.yml.

name: daily-vendor-publish

on:
  schedule:
    - cron: "30 13 * * 0,2-6" # daily 13:30 UTC, except Mondays (weekly run covers them)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: insights-pipeline # shared with weekly-insights so runs never overlap
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 45 (was 30): the retry loop below can idle through USAspending outages.
    # A normal day is ~2 minutes; this is headroom for a bad one.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Same resume machinery as weekly-insights, which this job never got.
      # Responses are cached per ISO week, so an attempt that dies partway
      # leaves what it fetched on disk and the next one walks past it. The key
      # prefix is shared with weekly-insights on purpose: whichever job runs
      # first in a given week warms the cache for the other, and the shared
      # `insights-pipeline` concurrency group means they never overlap.
      - name: Compute cache key (ISO week)
        id: week
        run: echo "week=$(date -u +%G-w%V)" >> "$GITHUB_OUTPUT"

      - name: Restore USAspending response cache
        uses: actions/cache/restore@v5
        with:
          path: .cache
          key: insights-usaspending-${{ steps.week.outputs.week }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            insights-usaspending-${{ steps.week.outputs.week }}-

      - name: Publish today's vendor profiles
        env:
          # Optional: enriches only today's new pages. Absent -> deterministic
          # fallback narratives; every LLM number is verified or discarded.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ATTEMPTS: "3"
          COOLDOWN_S: "120"
          DEADLINE_MINUTES: "30"
        run: |
          started=$SECONDS
          for attempt in $(seq 1 "$ATTEMPTS"); do
            elapsed_min=$(( (SECONDS - started) / 60 ))
            if [ "$attempt" -gt 1 ] && [ "$elapsed_min" -ge "$DEADLINE_MINUTES" ]; then
              echo "::error::Stopping after ${attempt} of ${ATTEMPTS} attempts: ${elapsed_min} minutes gone of a ${DEADLINE_MINUTES}-minute budget. The response cache is saved below, so a Re-run resumes from here."
              exit 1
            fi
            echo "::group::insights:vendors-daily — attempt $attempt of $ATTEMPTS"
            if npm run insights:vendors-daily; then
              echo "::endgroup::"
              echo "Publish completed on attempt $attempt."
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt "$ATTEMPTS" ]; then
              echo "::warning::Attempt $attempt failed. Cooling down ${COOLDOWN_S}s, then resuming from the response cache."
              sleep "$COOLDOWN_S"
            fi
          done
          echo "::error::All $ATTEMPTS attempts failed. A single unbuildable vendor no longer reaches this point — it is isolated and marked in the roster — so reaching here means USAspending was unreachable for the whole run."
          exit 1

      # Save even on failure: a partial cache is exactly what lets the next
      # attempt get further.
      - name: Save USAspending response cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .cache
          key: insights-usaspending-${{ steps.week.outputs.week }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Validate (commit gate)
        run: npm run insights:validate

      - name: Verify the site still builds
        run: npm run build

      - name: Commit new vendor profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/insights
          if git diff --cached --quiet; then
            echo "No new vendor profiles today — nothing to commit."
          else
            git commit -m "insights: daily vendor profile publish $(date -u +%F)"
            scripts/ci/git-push-retry.sh
          fi
