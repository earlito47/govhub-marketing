# Vendor "claim your page" outreach — daily drip.
#
# For every vendor with a PUBLISHED profile page: resolve a contact (SBA
# certification search — the only tier), then send at most 10 plain-text notes
# per day from Jerr inviting the vendor to review its page and reply with
# edits. One email per vendor ever; data/vendor-outreach.json is the committed
# ledger (idempotency + reply-based opt-out suppression). See the header of
# scripts/outreach/vendor-outreach.mjs for the full rules.
#
# SHIPS DISABLED. Until the repo variable OUTREACH_ENABLED is set to "true",
# every run is a dry run that prints what would send and exits green — same
# gate pattern as publish-social. Flip the variable only after reviewing a
# dry run and a --test send.
#
# Setup (one-time, by a maintainer):
#   Secrets:   RESEND_API_KEY  (contact resolution needs no key)
#   Variables: OUTREACH_ENABLED ("true" to send)
#              OUTREACH_POSTAL  (postal address for the signature; required)
#              OUTREACH_FROM    (optional, default "Jerr at GovHub <hello@govhub.online>")
#              OUTREACH_REPLY_TO (optional, default hello@govhub.online)

name: vendor-outreach

on:
  schedule:
    - cron: "15 15 * * *" # daily 15:15 UTC, after the 13:30 vendor publish
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: vendor-outreach
  cancel-in-progress: false

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      # No npm ci: the script and the roster lib it imports are stdlib-only.

      # Cheap and network-free, and it runs BEFORE any send: the company name
      # and the greeting are the two things a vendor only ever sees once.
      - name: Self-test the email rendering
        run: node scripts/outreach/vendor-outreach.selftest.mjs

      # SBA is keyless and free, so --limit is now politeness toward their
      # service rather than a spend ceiling. Each vendor is attempted ONCE:
      # SBA matches on UEI and holds small businesses only, so a prime or an
      # FFRDC operator it cannot answer for will never be answerable, and the
      # row is retired instead of re-queued. This queue therefore drains to
      # nothing by design; the digest reports the retired count so it stays
      # visible. (APOLLO_API_KEY was removed 2026-09-05 — the secret can be
      # deleted from the repo settings.)
      - name: Resolve contacts for newly published vendors
        run: node scripts/outreach/vendor-outreach.mjs --resolve --limit 15

      - name: Dry run (always logged, the audit trail for what send would do)
        run: node scripts/outreach/vendor-outreach.mjs
        env:
          OUTREACH_FROM: ${{ vars.OUTREACH_FROM }}
          OUTREACH_POSTAL: ${{ vars.OUTREACH_POSTAL }}

      - name: Send today's batch
        if: vars.OUTREACH_ENABLED == 'true'
        run: node scripts/outreach/vendor-outreach.mjs --send --limit 10
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OUTREACH_FROM: ${{ vars.OUTREACH_FROM }}
          OUTREACH_REPLY_TO: ${{ vars.OUTREACH_REPLY_TO }}
          OUTREACH_POSTAL: ${{ vars.OUTREACH_POSTAL }}

      # The ledger is the send record — committing it is what makes tomorrow's
      # run skip today's vendors. [skip ci] keeps this from triggering builds.
      #
      # always(): a send that fails partway through has still mailed the
      # vendors ahead of it in the batch. Leaving that uncommitted because the
      # step went red is how a vendor gets a second email, which is the one
      # thing this workflow must never do. The script records each send before
      # it moves on, so the ledger is accurate even on a failed run.
      #
      # Rebase before pushing: main moves under this job (the vendor publish
      # and the digest both commit), and a rejected push would lose the same
      # record.
      - name: Commit ledger
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vendor-outreach.json
          if git diff --cached --quiet; then
            echo "Ledger unchanged."
            exit 0
          fi
          git commit -m "outreach: ledger update $(date -u +%F) [skip ci]"
          # Shared with the other committing workflows. Losing this particular
          # push is the costly one: the emails have already gone out, so a
          # dropped ledger update means the next run re-sends to the same
          # vendors. Hence the extra attempts.
          PUSH_ATTEMPTS=6 scripts/ci/git-push-retry.sh || {
            echo "::error::The outreach ledger was not pushed. Sends from this run are NOT recorded; do not re-run until it is committed by hand."
            exit 1
          }
