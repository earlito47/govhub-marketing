# TEMPORARY diagnostic. Delete once the Search Console pull is confirmed.
#
# Actions secrets only exist inside a runner, so this is the only place the
# GSC credentials can actually be exercised. It is read-only: the scope is
# webmasters.readonly and the job commits nothing.
#
# It runs on push to the feature branch because weekly-content is not on the
# default branch yet, so workflow_dispatch is not available for it.

name: gsc-check

on:
  push:
    branches: [claude/weekly-blog-linkedin-scheduler-fs9sle]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet -r scripts/content/requirements.txt

      - name: Diagnose Search Console access
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY || 'sc-domain:govhub.online' }}
        run: python scripts/content/gsc_check.py

      - name: Run the real topic picker
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY || 'sc-domain:govhub.online' }}
        run: |
          python scripts/content/pick_topic.py > /dev/null
          echo "=== topic.json ==="
          cat topic.json
          echo
          python - <<'PY'
          import json
          source = json.load(open("topic.json"))["source"]
          if source == "gsc_striking_distance":
              print("VERDICT: the Search Console path works end to end.")
          else:
              print(f"VERDICT: fell back to '{source}'. See the diagnosis above "
                    f"for why. This is expected if the property has no "
                    f"striking-distance queries yet.")
          PY
