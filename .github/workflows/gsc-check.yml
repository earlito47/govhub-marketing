# TEMPORARY diagnostic. Delete once the Search Console pull is confirmed.
#
# Actions secrets only exist inside a runner, so this is the only place the
# GSC credentials can actually be exercised. It is read-only: the scope is
# webmasters.readonly and the job commits nothing.
#
# It runs on push to the feature branch because weekly-content is not on the
# default branch yet, so workflow_dispatch is not available for it.

name: gsc-check

on:
  push:
    branches: [claude/weekly-blog-linkedin-scheduler-fs9sle]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet -r scripts/content/requirements.txt

      # A secret that resolves to empty and a secret that resolves to a real
      # value look different in the log: a real one renders as ***, empty
      # renders as nothing. So when the value is empty, the useful question is
      # which names this repo actually has. toJSON(secrets) answers that. The
      # values it contains are masked by the runner, and this step prints keys
      # only, never values.
      - name: List configured secret and variable names
        env:
          SECRET_BLOB: ${{ toJSON(secrets) }}
          VAR_BLOB: ${{ toJSON(vars) }}
        run: |
          python - <<'PY'
          import json, os
          for label, raw in (("Secrets", os.environ["SECRET_BLOB"]),
                             ("Variables", os.environ["VAR_BLOB"])):
              try:
                  names = sorted(json.loads(raw or "{}").keys())
              except json.JSONDecodeError:
                  names = None
              if names is None:
                  print(f"{label}: could not parse the context blob.")
              elif names:
                  print(f"{label} configured on this repo ({len(names)}):")
                  for n in names:
                      print(f"    {n}")
              else:
                  print(f"{label}: none configured on this repo.")
          PY

      - name: Diagnose Search Console access
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY || 'sc-domain:govhub.online' }}
        run: python scripts/content/gsc_check.py

      - name: Run the real topic picker
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_PROPERTY: ${{ vars.GSC_PROPERTY || 'sc-domain:govhub.online' }}
        run: |
          python scripts/content/pick_topic.py > /dev/null
          echo "=== topic.json ==="
          cat topic.json
          echo
          python - <<'PY'
          import json
          source = json.load(open("topic.json"))["source"]
          if source == "gsc_striking_distance":
              print("VERDICT: the Search Console path works end to end.")
          else:
              print(f"VERDICT: fell back to '{source}'. See the diagnosis above "
                    f"for why. This is expected if the property has no "
                    f"striking-distance queries yet.")
          PY
