# Runs `npm run verify` on every pull request into main, and on main itself.
#
# Why this exists: the repo already has good publishing guards (check:meta for
# SERP title/description budgets, guard:emdash for the voice standard, guard for
# unresolved {{STAT}} tokens), but nothing ran them before a merge. They only
# fired when someone remembered to run `npm run verify` locally. An em dash
# reached the homepage that way and sat on main failing guard:emdash until it
# was noticed by hand.
#
# The weekly-content pipeline gates its own drafts on `npm run verify`, so
# generated posts were already covered. This closes the same gap for
# hand-written changes.
#
# No secrets and no network beyond npm, so it is safe to run on any pull
# request. It only reads.

name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# One run per branch. A force-push or a quick follow-up commit cancels the
# in-flight run rather than queueing a second one against stale code.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # astro check, then build, then the three guards against dist/.
      # See the "verify" script in package.json for the exact chain.
      - name: Verify
        run: npm run verify
